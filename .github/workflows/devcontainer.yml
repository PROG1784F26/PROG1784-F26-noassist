name: Devcontainer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  setup-portability:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s .devcontainer/tests -v
      - run: ruff check .
      - run: ruff format --check .

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @devcontainers/cli
      - name: Start the Python devcontainer
        run: devcontainer up --workspace-folder . --skip-non-blocking-commands
      - name: Check Python environment and workspace permissions
        run: |
          devcontainer exec --workspace-folder . python .devcontainer/smoke.py
          devcontainer exec --workspace-folder . python examples/hello.py
      - if: always()
        run: docker compose -f .devcontainer/compose.yaml down
